<!-- ============================================================
     SPANDIS · Meal Builder embed
     VERSION: 2.1 — the viewport bridge removed again
     WHERE: Meal Builder page in GHL → Custom Code

     This is the COMPLETE block, and it is back to what it was before
     v2.0: markup, the iOS sizing fix, the 900px initial height, the
     height transition, and the resize listener. Nothing else.

     ─────────────────────────────────────────────────────────────
     WHAT HAPPENED TO v2.0

     v2.0 added a channel that told the builder how tall the customer's
     screen was, so the Terms & Conditions modal could size itself
     against the phone instead of against 100vh — which, inside a
     scrolling="no" iframe grown to its content height, is the height
     of the whole builder rather than the height of the screen.

     It fixed the modal in Chromium and in desktop WebKit. On a real
     iPhone it changed nothing: the terms still showed one clipped
     line. So the premise was wrong. The problem was not that we had
     the wrong number for the viewport; it was that a modal inside
     this iframe has no viewport worth having.

     The terms are ordinary page content now — they expand inline
     under the checkbox, the iframe grows to fit them via the resize
     message that already worked, and the page scrolls past them like
     it scrolls past everything else. Nothing in the builder reads a
     viewport height any more, so nothing needs to be told one.

     NO RUSH. If v2.0 is still pasted on the page, it is harmless —
     it posts a message the builder no longer listens for. The only
     cost is one postMessage per animation frame while scrolling,
     which is worth removing on a phone but is not breaking anything.
     Replace it whenever convenient.

     ─────────────────────────────────────────────────────────────
     DO NOT REMOVE

       width: 1px + min-width: 100%   the iOS sizing fix. An iframe on
       iOS ignores width: 100% and lays out at its content width; a 1px
       width with a 100% minimum forces it to the container instead.

       scrolling="no" + the resize listener   together these make the
       builder as tall as its content so the page scrolls as one piece
       rather than trapping a scrollbar inside a box. Everything that
       works on a phone works because of this pair.
============================================================ -->

<style>
  #spandis-wrap {
    position: relative;
    width: 100%;
    max-width: 100%;
    overflow: visible;
  }
  #spandis-frame {
    display: block;
    width: 1px;
    min-width: 100%;
    border: none;
    overflow: hidden;
    transition: height 180ms ease;
  }
</style>

<div id="spandis-wrap">
  <iframe
    id="spandis-frame"
    src="https://spandi-s-meal-builder.vercel.app/"
    scrolling="no"
    title="Spandi's Meal Builder"
  ></iframe>
</div>

<script>
  (function () {
    var frame = document.getElementById('spandis-frame');

    // Tall initial height while page loads
    frame.style.height = '900px';

    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'spandis-resize') return;
      var h = parseInt(e.data.height, 10);
      if (!h || h < 300) return;
      frame.style.height = h + 'px';
    });
  })();
</script>
