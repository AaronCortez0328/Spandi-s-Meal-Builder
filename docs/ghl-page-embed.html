<!-- ============================================================
     SPANDIS · Meal Builder embed
     VERSION: 3.0
     WHERE: Meal Builder page in GHL → Custom Code

     COMPLETE BLOCK. Replaces whatever is on the page now (v1 or v2.0);
     it is not a second copy to paste alongside. Everything that was
     already working is unchanged — the markup, the iOS sizing fix, the
     900px initial height, the height transition, the resize listener.

     ─────────────────────────────────────────────────────────────
     WHAT v3.0 CHANGES, AND WHY

     v2.0 told the builder how tall the customer's screen was, so the
     Terms & Conditions popup could place itself. It sent the WHOLE
     browser viewport, which was wrong twice over, and on Android both
     showed:

       The band began at pixel 0 — behind the floating navbar. The
       popup centred into that dead space and its header was cut off
       above the navbar.

       The band was not clamped to the iframe. Near the bottom of the
       page the viewport runs past the end of the builder, so the popup
       centred into the overrun and the iframe's own edge sliced it
       through the middle of the agree button. The dark footer visible
       under the cut is this page, not something covering the popup.

     v3.0 sends the builder's TRUE VISIBLE BAND instead: the part of
     the iframe that is actually on screen, in the iframe's own
     coordinates, with fixed page furniture at the top and bottom
     already subtracted. The navbar and the chat bubble are found by
     hit-testing rather than hardcoded, so either can change height
     without this needing an edit.

     It also handles one new message, spandis-modal, which holds the
     page still while a popup is open. The popup used to be re-placed
     on every scroll frame — one frame behind the finger, which is what
     the vibrating was. A modal should stop the page rather than ride
     it; with the page still, there is nothing to chase.

     ─────────────────────────────────────────────────────────────
     MESSAGES

       out  spandis-view   { top, height }   the visible band
       in   spandis-resize { height }        grow the frame (unchanged)
       in   spandis-view-request             builder booted, send again
       in   spandis-modal  { open }          freeze / unfreeze the page

     ─────────────────────────────────────────────────────────────
     DO NOT REMOVE

       width: 1px + min-width: 100%   the iOS sizing fix. An iframe on
       iOS ignores width: 100% and lays out at its content width; a 1px
       width with a 100% minimum forces it to the container.

       scrolling="no" + the resize listener   together these make the
       builder as tall as its content so the page scrolls as one piece
       instead of trapping a scrollbar in a box.
============================================================ -->

<style>
  #spandis-wrap {
    position: relative;
    width: 100%;
    max-width: 100%;
    overflow: visible;
  }
  #spandis-frame {
    display: block;
    width: 1px;
    min-width: 100%;
    border: none;
    overflow: hidden;
    transition: height 180ms ease;
  }
  /* Set while a popup is open inside the builder. */
  html.spandis-locked,
  html.spandis-locked body {
    overflow: hidden !important;
    touch-action: none;
  }
</style>

<div id="spandis-wrap">
  <iframe
    id="spandis-frame"
    src="https://spandi-s-meal-builder.vercel.app/"
    scrolling="no"
    title="Spandi's Meal Builder"
  ></iframe>
</div>

<script>
  (function () {
    var frame = document.getElementById('spandis-frame');

    // Tall initial height while the page loads
    frame.style.height = '900px';

    function viewportH() {
      return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    }

    /**
     * How much of the top (or bottom) of the screen is covered by fixed page
     * furniture -- the floating navbar, the chat bubble.
     *
     * Probes a LADDER of points, not a single one. The navbar floats with a
     * gap above it and the chat bubble sits inset from the bottom, so a probe
     * at the very first or last pixel lands in empty space and finds nothing
     * -- which is exactly how the popup ended up under both of them. Three x
     * positions per row because the bubble is in a corner and a centre-only
     * probe would miss it.
     *
     * Hit-testing rather than a hardcoded height, so either can be restyled
     * without this needing an edit.
     */
    function chromeInset(fromTop) {
      var w = window.innerWidth, vh = viewportH();
      var xs = [w * 0.5, w * 0.12, w * 0.88];
      var depth = Math.min(180, vh * 0.3);
      var inset = 0;

      for (var d = 2; d <= depth; d += 14) {
        var y = fromTop ? d : vh - d;
        for (var i = 0; i < xs.length; i++) {
          var el = document.elementFromPoint(Math.round(xs[i]), Math.round(y));
          while (el && el !== document.body && el !== document.documentElement) {
            var pos = window.getComputedStyle(el).position;
            if (pos === 'fixed' || pos === 'sticky') {
              var r = el.getBoundingClientRect();
              inset = Math.max(inset, fromTop ? r.bottom : vh - r.top);
              break;
            }
            el = el.parentElement;
          }
        }
      }
      return Math.max(0, inset);
    }

    var queued = false;

    function sendView() {
      queued = false;
      if (!frame || !frame.contentWindow) return;

      var rect = frame.getBoundingClientRect();
      var vh = viewportH();

      // Page furniture, measured now.
      var insetTop = chromeInset(true);
      var insetBot = chromeInset(false);
      // Never let furniture claim more than half the screen — a full-height
      // fixed overlay would otherwise report a band of nothing.
      if (insetTop + insetBot > vh * 0.5) { insetTop = 0; insetBot = 0; }

      // The visible band, in the BUILDER'S coordinates. Clamped to the frame
      // at both ends, so it can never start above the builder or run past
      // the end of it.
      var top = Math.max(0, insetTop - rect.top);
      var bottom = Math.min(rect.height, vh - insetBot - rect.top);
      var height = Math.round(bottom - top);

      // Nothing useful on screen (scrolled past, or not reached yet). Saying
      // nothing beats sending a band the popup cannot fit in.
      if (height < 160) return;

      frame.contentWindow.postMessage({
        type: 'spandis-view',
        top: Math.round(top),
        height: height
      }, '*');
    }

    function queueView() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(sendView);
    }

    window.addEventListener('scroll', queueView, { passive: true });
    window.addEventListener('resize', queueView);
    window.addEventListener('orientationchange', queueView);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', queueView);
      window.visualViewport.addEventListener('scroll', queueView);
    }
    window.addEventListener('load', queueView);
    queueView();

    // ── freezing the page while a popup is open ─────────────────────────
    var lockedY = 0;

    function lockScroll() {
      lockedY = window.scrollY || window.pageYOffset || 0;
      document.documentElement.classList.add('spandis-locked');
    }

    function unlockScroll() {
      if (!document.documentElement.classList.contains('spandis-locked')) return;
      document.documentElement.classList.remove('spandis-locked');
      // Some browsers jump to the top when overflow is released. Put the
      // customer back exactly where they were.
      window.scrollTo(0, lockedY);
    }

    // ── one listener, every message ─────────────────────────────────────
    window.addEventListener('message', function (e) {
      if (!e.data || typeof e.data !== 'object') return;

      // Grow the frame to fit its content.
      if (e.data.type === 'spandis-resize') {
        var h = parseInt(e.data.height, 10);
        if (!h || h < 300) return;
        frame.style.height = h + 'px';
        // The frame just changed height, so everything below it moved.
        queueView();
        return;
      }

      // The builder booted after this script ran and missed the first send.
      if (e.data.type === 'spandis-view-request') { queueView(); return; }

      // A popup opened or closed inside the builder.
      if (e.data.type === 'spandis-modal') {
        if (e.data.open) { lockScroll(); queueView(); } else { unlockScroll(); }
      }
    });
  })();
</script>
